
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>محفظتي | إدارة أموالك</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }
    header {
      background: #101827;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }
    main { max-width: 520px; margin: 28px auto; padding: 0 16px; }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #10182710;
    }
    label { display: block; margin: 14px 0 7px; }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 16px;
    }
    input { border: 1px solid #d4dbe6; }
    button {
      border: 0;
      background: #176b52;
      color: white;
      margin-top: 12px;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { line-height: 1.7; overflow-wrap: anywhere; }
    .muted { color: #64748b; font-size: 14px; }
    [hidden] { display: none !important; }
    footer { text-align: center; padding: 20px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>💳 محفظتي</h1>
    <p>إدارة أموالك بطريقة بسيطة ومنظمة</p>
  </header>

  <main>
    <section class="card" id="authCard">
      <h2>أهلًا بك في محفظتي</h2>
      <p class="muted">أنشئ حسابًا أو سجّل الدخول للمتابعة.</p>

      <form id="authForm">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">كلمة المرور (6 أحرف على الأقل)</label>
        <input id="password" type="password" minlength="6"
          autocomplete="current-password" required>

        <button id="loginBtn" type="submit">تسجيل الدخول</button>
        <button id="signupBtn" class="secondary" type="button">
          إنشاء حساب جديد
        </button>
      </form>

      <button id="googleBtn" class="secondary" type="button">
        المتابعة باستخدام Google
      </button>
      <button id="resetBtn" class="secondary" type="button">
        نسيت كلمة المرور؟
      </button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card" id="accountCard" hidden>
      <h2>حسابك في محفظتي</h2>
      <p id="userEmail"></p>
      <p class="muted">
        تم تسجيل الدخول. سنضيف سجل الدخل والمصروفات في الخطوة التالية.
      </p>
      <button id="logoutBtn">تسجيل الخروج</button>
    </section>
  </main>

  <footer>محفظتي © 2026</footer>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://wygqkmiwggfscwkdvgth.supabase.co';

    const SUPABASE_PUBLIC_KEY =
      'sb_publishable_F81NJjLtbaTNFqlYge81kA_gRYzc3UX';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const $ = id => document.getElementById(id);
    const form = $('authForm');
    const message = $('message');
    const loginBtn = $('loginBtn');
    const signupBtn = $('signupBtn');
    const googleBtn = $('googleBtn');
    const resetBtn = $('resetBtn');

    function say(text) {
      message.textContent = text;
    }

    function busy(value) {
      [loginBtn, signupBtn, googleBtn, resetBtn].forEach(button => {
        button.disabled = value;
      });
    }

    function showAccount(user) {
      $('authCard').hidden = Boolean(user);
      $('accountCard').hidden = !user;
      if (user) $('userEmail').textContent = user.email || '';
    }

    async function runAuth(action) {
      const email = $('email').value.trim();
      const password = $('password').value;

      if (!email) {
        say('اكتب بريدك الإلكتروني أولًا.');
        return;
      }

      if (action !== 'reset' && password.length < 6) {
        say('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');
        return;
      }

      busy(true);
      say('جارٍ تنفيذ الطلب...');

      try {
        if (action === 'signup') {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: {
              emailRedirectTo: window.location.origin
            }
          });
          if (error) throw error;

          if (data.session) {
            showAccount(data.user);
            say('تم إنشاء الحساب وتسجيل الدخول بنجاح.');
          } else {
            say('تم إرسال طلب إنشاء الحساب. افحص بريدك لتأكيد الحساب، ثم سجّل الدخول.');
          }
        }

        if (action === 'login') {
          const { data, error } =
            await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;

          showAccount(data.user);
          say('تم تسجيل الدخول بنجاح.');
        }

        if (action === 'reset') {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin
          });
          if (error) throw error;
          say('إذا كان البريد صالحًا، ستصلك تعليمات إعادة تعيين كلمة المرور.');
        }
      } catch (error) {
        console.error(error);
        say('لم تنجح العملية. تحقق من البريد وكلمة المرور وإعدادات Supabase، ثم حاول مجددًا.');
      } finally {
        busy(false);
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      runAuth('login');
    });

    signupBtn.addEventListener('click', () => runAuth('signup'));
    resetBtn.addEventListener('click', () => runAuth('reset'));

    googleBtn.addEventListener('click', async () => {
      busy(true);
      say('جارٍ فتح تسجيل الدخول باستخدام Google...');
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin }
        });
        if (error) throw error;
      } catch (error) {
        console.error(error);
        say('تعذّر بدء تسجيل الدخول. تحقق من إعدادات Google في Supabase.');
        busy(false);
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) {
        say('تعذّر تسجيل الخروج. حاول مرة أخرى.');
        return;
      }
      showAccount(null);
      say('تم تسجيل الخروج.');
    });

    const { data: { session } } = await supabase.auth.getSession();
    showAccount(session?.user || null);

    supabase.auth.onAuthStateChange((_event, session) => {
      showAccount(session?.user || null);
    });
  </script>
</body>
</html>
